<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JR Dashboard - Manuten&ccedil;&atilde;o</title>
  <link rel="icon" href="{{ url_for('static', filename='logo-jr.png') }}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo-jr.png') }}" alt="JR" class="logo">
      <h1>JR DASHBOARD &bull; Manuten&ccedil;&atilde;o</h1>
    </div>
    <div class="filters">
      <select id="ano"></select>
      <select id="mes" multiple></select>
      <select id="placa"></select>
      <select id="oficina"></select>
      <select id="segmento"></select>
      <button id="limpar">Limpar filtros</button>
      <a href="{{ url_for('home') }}" class="back-btn">&larr; Voltar</a>
    </div>
  </header>

  <main class="container">
    <div class="export-bar">
      <button type="button" class="export-btn" id="export-manu-cards">Exportar cards (PNG)</button>
      <button type="button" class="export-btn" id="export-manu-page">Exportar p&aacute;gina (PNG)</button>
      <button type="button" class="toggle-btn" id="toggle-manu-cards">Ocultar cards</button>
      <button type="button" class="toggle-btn" id="toggle-manu-charts">Ocultar gr&aacute;ficos</button>
    </div>
    <div class="visibility-panel" id="visibility-manu"></div>
    <section class="kpis">
      <div class="kpi red" id="kpi-manu-total">
        <div class="kpi-title">Custo total (R$)</div>
        <div id="kpi-custo" class="kpi-value">--</div>
      </div>
      <div class="kpi blue" id="kpi-manu-servicos">
        <div class="kpi-title">Servi&ccedil;os</div>
        <div id="kpi-servicos" class="kpi-value">--</div>
      </div>
      <div class="kpi green" id="kpi-manu-ticket">
        <div class="kpi-title">Ticket m&eacute;dio</div>
        <div id="kpi-ticket" class="kpi-value">--</div>
      </div>
      <div class="kpi yellow" id="kpi-manu-media">
        <div class="kpi-title">M&eacute;dia mensal (R$)</div>
        <div id="kpi-media-mensal" class="kpi-value">--</div>
      </div>
    </section>

    <section class="grid">
      <div class="card" id="card-manu-placa"><h2>Gasto por placa</h2><div id="chart-placa"></div></div>
      <div class="card" id="card-manu-oficina"><h2>Gasto por oficina</h2><div id="chart-oficina"></div></div>
      <div class="card" id="card-manu-mensal"><h2>Gasto mensal</h2><div id="chart-mensal"></div></div>
      <div class="card" id="card-manu-semanal"><h2>Gasto semanal (&uacute;ltimos 7 dias)</h2><div id="chart-semanal"></div></div>
    </section>
  </main>

  <footer class="footer">
    Atualizado automaticamente a partir da planilha em <code>data/manutencao.xlsx</code>. &copy; JR
  </footer>

<script>
const fmtBRL = (value) => Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const currentYear = String(new Date().getFullYear());
const currentMonth = new Date().getMonth() + 1;
const fmtNum = (value) => Number(value || 0).toLocaleString('pt-BR');
const safeArray = (source, key) => (source && Array.isArray(source[key])) ? source[key] : [];
const MONTH_MAP = {
  jan: '01',
  fev: '02',
  mar: '03',
  abr: '04',
  mai: '05',
  jun: '06',
  jul: '07',
  ago: '08',
  set: '09',
  out: '10',
  nov: '11',
  dez: '12'
};
const formatMonthKey = (value) => {
  if (!value) return '';
  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}`;
  }
  const text = String(value).trim();
  if (!text) return '';
  const isoMatch = text.match(/(20\d{2})[-/](\d{2})/);
  if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}`;
  const brMatch = text.toLowerCase().match(/^([a-z]{3})\/?(\d{2,4})/);
  if (brMatch) {
    const mm = MONTH_MAP[brMatch[1]];
    const year = brMatch[2].length === 2 ? `20${brMatch[2]}` : brMatch[2];
    if (mm) return `${year}-${mm}`;
  }
  const asDate = new Date(text);
  if (!Number.isNaN(asDate.getTime())) {
    return `${asDate.getFullYear()}-${String(asDate.getMonth() + 1).padStart(2, '0')}`;
  }
  return text;
};
const MONTH_LABELS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const formatMonthLabel = (value, includeYear = true) => {
  const key = formatMonthKey(value);
  const match = key.match(/(20\d{2})-(\d{2})/);
  if (!match) return key;
  const monthIndex = Number(match[2]) - 1;
  const label = MONTH_LABELS[monthIndex] || match[2];
  if (!includeYear) return label;
  return `${label}/${match[1].slice(-2)}`;
};
const parseMonthSortKey = (value, fallbackYear = null) => {
  const key = formatMonthKey(value);
  const match = key.match(/(20\d{2})-(\d{2})/);
  if (match) {
    return { year: Number(match[1]), month: Number(match[2]) };
  }
  const text = String(value || '').trim().toLowerCase();
  if (!text) return null;
  const abbrMatch = text.match(/([a-z]{3})/);
  const monthStr = abbrMatch ? MONTH_MAP[abbrMatch[1]] : null;
  if (!monthStr) return null;
  let year = null;
  const yearMatch = text.match(/(\d{2,4})/);
  if (yearMatch) {
    year = yearMatch[1];
  } else if (fallbackYear !== null && fallbackYear !== undefined && fallbackYear !== '') {
    year = String(fallbackYear);
  }
  if (!year) return null;
  const yearNum = Number(year.length === 2 ? `20${year}` : year);
  if (!Number.isFinite(yearNum)) return null;
  return { year: yearNum, month: Number(monthStr) };
};
const sortMonthlySeries = (meses, valores, includeYear = true, fallbackYear = null) => {
  const items = (meses || []).map((mes, idx) => ({
    mes,
    sortKey: parseMonthSortKey(mes, fallbackYear),
    idx,
    valor: Array.isArray(valores) ? valores[idx] : undefined
  }));
  const getOrderValue = (item) => {
    if (!item.sortKey) return null;
    return includeYear ? (item.sortKey.year * 100 + item.sortKey.month) : item.sortKey.month;
  };
  const ordered = [...items].sort((a, b) => {
    const aVal = getOrderValue(a);
    const bVal = getOrderValue(b);
    if (aVal !== null && bVal !== null) return aVal - bVal;
    if (aVal !== null) return -1;
    if (bVal !== null) return 1;
    return a.idx - b.idx;
  });
  return {
    labels: ordered.map((item) => formatMonthLabel(item.mes, includeYear)),
    values: ordered.map((item) => item.valor)
  };
};
const ensureExportButton = (chartId, filename) => {
  const chart = document.getElementById(chartId);
  if (!chart) return;
  const parent = chart.parentElement;
  if (!parent) return;
  parent.style.position = parent.style.position || 'relative';
  let btn = parent.querySelector(`button.chart-export[data-for="${chartId}"]`);
  if (!btn) {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chart-export';
    btn.dataset.for = chartId;
    btn.textContent = 'PNG';
    parent.appendChild(btn);
  }
  btn.onclick = () => Plotly.downloadImage(chartId, { format: 'png', filename: filename || chartId, scale: 2 });
};
// Export helper: clona o elemento dentro de um wrapper com padding/largura fixa para capturar a sombra no PNG.
const exportElementToPng = async (el, filename) => {
  if (!el || typeof html2canvas !== 'function') return;
  const bg = getComputedStyle(document.body).backgroundColor || '#f5f6fa';
  const rect = el.getBoundingClientRect();
  const clone = el.cloneNode(true);
  clone.style.width = `${rect.width}px`;
  const wrapper = document.createElement('div');
  wrapper.style.padding = '20px';
  wrapper.style.background = bg;
  wrapper.style.display = 'block';
  wrapper.style.width = `${rect.width + 40}px`; // padding + área para sombra
  wrapper.style.boxSizing = 'border-box';
  wrapper.style.position = 'relative';
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);
  const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: bg, useCORS: true });
  document.body.removeChild(wrapper);
  const link = document.createElement('a');
  link.download = `${filename || 'export'}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
};

function setupVisibility(panelId, items) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  panel.innerHTML = '';
  items.forEach(({ selector, label, cardSelector }) => {
    const target = document.querySelector(cardSelector || selector);
    if (!target) return;
    const inputId = `${panelId}-${selector.replace(/[^a-z0-9]/gi, '')}`;
    const wrapper = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = inputId;
    checkbox.checked = !target.classList.contains('hidden-section');
    checkbox.addEventListener('change', () => {
      target.classList.toggle('hidden-section', !checkbox.checked);
    });
    const text = document.createTextNode(label);
    wrapper.setAttribute('for', inputId);
    wrapper.appendChild(checkbox);
    wrapper.appendChild(text);
    panel.appendChild(wrapper);
  });
}

async function fetchData() {
  const params = new URLSearchParams();
  params.append('ano', document.getElementById('ano').value || 'Todos');
  appendMulti(params, 'mes', getSelectValues('mes'));
  params.append('placa', document.getElementById('placa').value || 'Todos');
  params.append('oficina', document.getElementById('oficina').value || 'Todos');
  params.append('segmento', document.getElementById('segmento').value || 'Todos');
  const res = await fetch('/data/manutencao?' + params.toString());
  return await res.json();
}

function fillSelect(id, values, label) {
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = 'Todos';
  optAll.textContent = `${label} (Todos)`;
  el.appendChild(optAll);
  (values || []).forEach((value) => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    el.appendChild(opt);
  });
  if ([...el.options].some((option) => option.value === current)) {
    el.value = current;
  }
}

const getSelectValues = (id) => {
  const el = document.getElementById(id);
  if (!el) return [];
  return Array.from(el.selectedOptions || []).map((opt) => opt.value);
};

function fillSelectMulti(id, values, label) {
  const el = document.getElementById(id);
  if (!el) return;
  const current = getSelectValues(id);
  el.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = 'Todos';
  optAll.textContent = `${label} (Todos)`;
  el.appendChild(optAll);
  (values || []).forEach((value) => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    el.appendChild(opt);
  });
  const optionMap = new Map(Array.from(el.options || []).map((opt) => [opt.value, opt]));
  const selection = current.filter((value) => optionMap.has(value));
  const finalSelection = selection.length ? selection : ['Todos'];
  finalSelection.forEach((value) => {
    const opt = optionMap.get(value);
    if (opt) opt.selected = true;
  });
}

function appendMulti(params, key, values) {
  const list = (values || []).filter((value) => value !== '');
  const hasTodos = list.includes('Todos');
  const cleaned = hasTodos && list.length > 1 ? list.filter((value) => value !== 'Todos') : list;
  if (!cleaned.length || cleaned.includes('Todos')) {
    params.append(key, 'Todos');
    return;
  }
  cleaned.forEach((value) => params.append(key, value));
}

function resetMultiSelect(id) {
  const el = document.getElementById(id);
  if (!el) return;
  Array.from(el.options || []).forEach((opt, idx) => {
    opt.selected = idx === 0;
  });
}

function enhanceMultiSelect(id, expandedSize = 10) {
  const el = document.getElementById(id);
  if (!el) return;
  el.multiple = true;
  el.size = 1;
  const expand = () => {
    el.classList.add('expanded');
    el.size = Math.min(expandedSize, el.options.length);
  };
  const collapse = () => {
    el.classList.remove('expanded');
    el.size = 1;
  };
  el.addEventListener('focus', expand);
  el.addEventListener('blur', collapse);
}

function drawBarVertical(divId, x, y) {
  const data = [{ type: 'bar', x: x || [], y: y || [], marker: { color: '#1C2D6B' } }];
  const layout = {
    margin: { l: 50, r: 20, t: 20, b: 60 },
    xaxis: { tickangle: -25, tickfont: { size: 10 }, automargin: true }
  };
  Plotly.newPlot(divId, data, { ...plotlyTheme.layout, ...layout }, plotlyTheme.config);
}

function drawBarHorizontal(divId, categories, values) {
  const data = [{
    type: 'bar',
    orientation: 'h',
    y: categories || [],
    x: values || [],
    marker: { color: '#1C2D6B' }
  }];
  const layout = {
    margin: { l: 150, r: 30, t: 20, b: 40 },
    yaxis: { automargin: true, tickfont: { size: 10 }, autorange: 'reversed' },
    xaxis: { tickfont: { size: 10 }, rangemode: 'tozero' }
  };
  Plotly.newPlot(divId, data, { ...plotlyTheme.layout, ...layout }, plotlyTheme.config);
}

async function refresh() {
  const d = await fetchData();

  fillSelect('ano', d.anos, 'Ano');
  fillSelectMulti('mes', d.meses, 'M\u00EAs');

  if (!refresh._init) {
    const anoSelect = document.getElementById('ano');
    fillSelect('placa', d.placas, 'Placa');
    fillSelect('oficina', d.oficinas, 'Oficina');
    fillSelect('segmento', d.segmentos, 'Categoria');
    ['ano', 'mes', 'placa', 'oficina', 'segmento'].forEach((id) => {
      document.getElementById(id).addEventListener('change', refresh);
    });
    document.getElementById('limpar').addEventListener('click', () => {
      if (anoSelect && [...anoSelect.options].some((opt) => opt.value === currentYear)) {
        anoSelect.value = currentYear;
      } else if (anoSelect) {
        anoSelect.value = 'Todos';
      }
      resetMultiSelect('mes');
      ['placa', 'oficina', 'segmento'].forEach((id) => {
        document.getElementById(id).value = 'Todos';
      });
      refresh();
    });
      enhanceMultiSelect('mes');
      refresh._init = true;
      const currentMesValue = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
      if (anoSelect && [...anoSelect.options].some((opt) => opt.value === currentYear)) {
        anoSelect.value = currentYear;
        const mesSelect = document.getElementById('mes');
        if (mesSelect && [...mesSelect.options].some((opt) => opt.value === currentMesValue)) {
          Array.from(mesSelect.options).forEach((opt) => { opt.selected = opt.value === currentMesValue; });
        }
        return refresh();
      }
  }

  document.getElementById('kpi-custo').textContent = fmtBRL(d.custo_total);
  document.getElementById('kpi-servicos').textContent = fmtNum(d.total_servicos);
  document.getElementById('kpi-ticket').textContent = fmtBRL(d.media_servico);
  document.getElementById('kpi-media-mensal').textContent = fmtBRL(d.media_mensal);

  drawBarHorizontal('chart-placa', safeArray(d.gasto_por_placa, 'PLACA'), safeArray(d.gasto_por_placa, 'Custo'));
  ensureExportButton('chart-placa', 'manutencao-gasto-por-placa');
  drawBarHorizontal('chart-oficina', safeArray(d.gasto_por_oficina, 'OFICINA'), safeArray(d.gasto_por_oficina, 'Custo'));
  ensureExportButton('chart-oficina', 'manutencao-gasto-por-oficina');

  const anoSelecionado = document.getElementById('ano')?.value || 'Todos';
  const incluiAno = anoSelecionado === 'Todos';
  const fallbackYear = incluiAno ? null : anoSelecionado;
  const mensalSeries = sortMonthlySeries(
    safeArray(d.custo_mensal, 'Mes'),
    safeArray(d.custo_mensal, 'Custo'),
    incluiAno,
    fallbackYear
  );
  const meses = mensalSeries.labels;
  const custos = mensalSeries.values;
  const trace = {
    type: 'scatter',
    mode: 'lines+markers',
    x: meses,
    y: custos,
    line: { color: '#1C2D6B', width: 3 },
    marker: { color: '#BE1E2D', size: 7 },
    hovertemplate: '<b>%{x}</b><br>R$ %{y:,.2f}<extra></extra>'
  };
  const layoutMensal = { margin: { l: 60, r: 20, t: 40, b: 60 }, xaxis: { tickangle: -30, type: 'category' }, yaxis: { title: 'R$' } };
  Plotly.newPlot('chart-mensal', [trace], { ...plotlyTheme.layout, ...layoutMensal }, plotlyTheme.config);
  ensureExportButton('chart-mensal', 'manutencao-gasto-mensal');

  const diasSemana = safeArray(d.custo_semana, 'Dia');
  const custoSemana = safeArray(d.custo_semana, 'Custo');
  const traceSemana = {
    type: 'bar',
    x: diasSemana,
    y: custoSemana,
    marker: { color: '#1C2D6B' },
    hovertemplate: '<b>%{x}</b><br>R$ %{y:,.2f}<extra></extra>'
  };
  const layoutSemana = { margin: { l: 60, r: 20, t: 40, b: 50 }, yaxis: { title: 'R$', rangemode: 'tozero' } };
  Plotly.newPlot('chart-semanal', [traceSemana], { ...plotlyTheme.layout, ...layoutSemana }, plotlyTheme.config);
  ensureExportButton('chart-semanal', 'manutencao-gasto-semanal');

  const kpiSection = document.querySelector('.kpis');
  const page = document.querySelector('main.container');
  const exportCards = document.getElementById('export-manu-cards');
  const exportPage = document.getElementById('export-manu-page');
  const root = document.documentElement;
  const toggleCards = document.getElementById('toggle-manu-cards');
  const toggleCharts = document.getElementById('toggle-manu-charts');
  const chartsSection = document.querySelector('.grid');
  const setToggle = (btn, el, stateLabel) => {
    if (!btn || !el) return;
    const hidden = el.classList.contains('hidden-section');
    btn.textContent = hidden ? `Mostrar ${stateLabel}` : `Ocultar ${stateLabel}`;
  };
  if (toggleCards && kpiSection) {
    toggleCards.onclick = () => {
      kpiSection.classList.toggle('hidden-section');
      setToggle(toggleCards, kpiSection, 'cards');
    };
    setToggle(toggleCards, kpiSection, 'cards');
  }
  if (toggleCharts && chartsSection) {
    toggleCharts.onclick = () => {
      chartsSection.classList.toggle('hidden-section');
      setToggle(toggleCharts, chartsSection, 'gráficos');
    };
    setToggle(toggleCharts, chartsSection, 'gráficos');
  }
  setupVisibility('visibility-manu', [
    { selector: '#kpi-manu-total', label: 'Custo total' },
    { selector: '#kpi-manu-servicos', label: 'Serviços' },
    { selector: '#kpi-manu-ticket', label: 'Ticket médio' },
    { selector: '#kpi-manu-media', label: 'Média mensal' },
    { selector: '#card-manu-placa', label: 'Gasto por placa' },
    { selector: '#card-manu-oficina', label: 'Gasto por oficina' },
    { selector: '#card-manu-mensal', label: 'Gasto mensal' },
    { selector: '#card-manu-semanal', label: 'Gasto semanal' },
  ]);
  if (exportCards && kpiSection) {
    exportCards.onclick = async () => {
      root.classList.add('exporting');
      await exportElementToPng(kpiSection, 'manutencao-cards');
      root.classList.remove('exporting');
    };
  }
  if (exportPage && page) {
    exportPage.onclick = async () => {
      root.classList.add('exporting');
      await exportElementToPng(page, 'manutencao-pagina');
      root.classList.remove('exporting');
    };
  }
}

const plotlyTheme = {
  layout: {
    paper_bgcolor: '#fff',
    plot_bgcolor: '#fff',
    font: { family: 'Inter, sans-serif', color: '#1C2D6B' },
    xaxis: { gridcolor: '#e5e7eb', linecolor: '#e5e7eb' },
    yaxis: { gridcolor: '#e5e7eb', linecolor: '#e5e7eb' }
  },
  config: {
    responsive: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['lasso2d', 'select2d']
  }
};

window.addEventListener('DOMContentLoaded', refresh);
</script>
</body>
</html>
